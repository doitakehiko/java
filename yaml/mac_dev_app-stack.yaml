apiVersion: v1
kind: Namespace
metadata:
  name: test-env
---
### 1. ロギングサーバー (Loki & Grafana)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-grafana
  namespace: test-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging
  template:
    metadata:
      labels:
        app: logging
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          ports:
            - containerPort: 3100
        - name: grafana
          image: grafana/grafana:11.0.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: logging-service
  namespace: test-env
spec:
  type: NodePort
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30000 # Windowsから http://<UbuntuのIP>:30000 でGrafanaにアクセス可能
    - name: loki
      port: 3100
      targetPort: 3100
  selector:
    app: logging
---
### 2. データベースサーバー (Source)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-source
  namespace: test-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-source
  template:
    metadata:
      labels:
        app: mysql-source
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "secret"
            - name: MYSQL_DATABASE
              value: "laravel_db"
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-source
  namespace: test-env
spec:
  ports:
    - port: 3306
  selector:
    app: mysql-source
---
### 3. データベースサーバー (Replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-replica
  namespace: test-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-replica
  template:
    metadata:
      labels:
        app: mysql-replica
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "secret"
            - name: MYSQL_DATABASE
              value: "laravel_db"
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  namespace: test-env
spec:
  ports:
    - port: 3306
  selector:
    app: mysql-replica
---
### 4. WEBアプリケーションサーバー (Nginx & PHP Laravel)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: test-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
        - name: php-laravel
          image: php:8.2-fpm-alpine
          # 実際にはここにLaravelのソースコードをマウントまたはビルドして入れます
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: test-env
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # WindowsのC#アプリから http://<UbuntuのIP>:30080 でアクセス可能
  selector:
    app: web-app
---
### 5. ログ収集 (Vector - DaemonSet)
# K8s全体のコンテナログが保管されている /var/log/pods からLokiへ自動転送します
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: test-env
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.41.X-alpine # 最新の安定版軽量イメージに変更
          args: ["--config-dir", "/etc/vector/"]
          securityContext:
            privileged: true # K8sのシステムログを読み込むための権限を追加
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: var-log
              mountPath: /var/log
            - name: vector-config-volume
              mountPath: /etc/vector/
      volumes:
        - name: var-log
          hostPath:
            path: /var/log
        # 追加：修正したConfigMap「vector-config」を紐付ける
        - name: vector-config-volume
          configMap:
            name: vector-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: test-env
data:
  vector.yaml: |
    sources:
      k8s_logs:
        type: "kubernetes_logs"
    sinks:
      loki:
        type: "loki"
        inputs: ["k8s_logs"]
        endpoint: "http://logging-service:3100"
        encoding:
          codec: "json"
        labels:  #  1つだけに修正
          job: "kubernetes-logs"
          pod_name: "{{ kubernetes.pod_name }}"
          container_name: "{{ kubernetes.container_name }}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: test-env
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: test-env
roleRef:
  kind: ClusterRole
  name: vector
  apiGroup: rbac.authorization.k8s.io

