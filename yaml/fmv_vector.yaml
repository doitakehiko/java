# 1. ログの収集元: このLinuxマシンのシステムログ（Journald）
sources:
  linux_syslog:
    type: "journald"

# 2. ラベルの付与: どのマシンから来たログか分かるように識別子をつける
transforms:
  add_labels:
    type: "remap"
    inputs:
      - "linux_syslog"
    source: |
      .environment = "test-env"
      .hostname = "proxy-linux"  # proxy Linuxの名前（任意）
      .job = "vector-test"

# 3. ログの送信先: 別PCにあるLokiサーバー（192.168.1.134）
sinks:
  loki_output:
    type: "loki"
    inputs:
      - "add_labels"
    endpoint: "http://192.168.1.134:3100"  # ロギングサーバーのIP
    encoding:
      codec: "json"
    labels:
      environment: "{{ environment }}"
      hostname: "{{ hostname }}"
      job: "{{ job }}"
