sources:
  urbackup_logs:
    type: "docker_logs"
    include_containers: ["urbackup-server"]

transforms:
  parse_urbackup:
    type: "remap"
    inputs: ["urbackup_logs"]
    source: |
      # 1. 元ログを文字列として取得
      log_raw = string!(.message)

      # 2. UrBackupのログ形式に適合する正規表現（ハイフン区切り・秒・コロンに対応）
      parsed, err = parse_regex(log_raw, r'^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}):\s+(?P<level>[A-Z]+):\s+(?P<msg>.*)$')

      # 3. マッチしない場合とマッチした場合の分岐処理
      if err != null || is_null(parsed) {
        .level = "unknown"
        .message = log_raw
      } else {
        res = object!(parsed)
        .level = downcase(string!(res.level))
        .message = string!(res.msg)
        .urbackup_timestamp = string!(res.timestamp)
      }

      # 不要なフィールドの削除
      del(.stream)
      del(.container_id)
      del(.container_name)
      del(.container_created_at)

sinks:
  loki_output:
    type: "loki"
    inputs: ["parse_urbackup"]
    endpoint: "http://192.168.1.134:3100"
    labels:
      job: "urbackup"
      level: "{{ level }}"
    encoding:
      codec: "json"

  console_debug:
    type: "console"
    inputs: ["parse_urbackup"]
    encoding:
      codec: "json"

